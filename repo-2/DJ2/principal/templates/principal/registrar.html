{% extends 'principal/base.html' %}

{% block title %}Nuevo Gasto{% endblock %}

{% block titulo %}Añadir Gasto a la Base de Datos{% endblock %}

{% block contenido %}
<div class="card shadow-sm border-0 col-md-6 mx-auto">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %} 
            
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                {{ form.descripcion }}
            </div>
            
            <div class="mb-3">
                <label class="form-label">Monto</label>
                {{ form.monto }}
            </div>
            
            <div class="mb-3">
                <label class="form-label">Fecha</label>
                {{ form.fecha }}
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar Gasto</button>
        </form>
    </div>
</div>
{% endblock %}
